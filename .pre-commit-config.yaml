default_install_hook_types: [pre-commit, commit-msg]
default_stages: [pre-commit]

# The quality tier is enforced here, not asserted. The gates under
# scripts/_ha_standards/ are written by ha-integration-standards; take a newer
# set of rules with `ha-standards sync` and commit the diff.
repos:
  - repo: local
    hooks:
      # Written by ha-integration-standards 0.1.2; `ha-standards sync`
      # updates them. Run `python3 scripts/_ha_standards/run.py --help` to see the gates.
      - id: ha-verify
        name: Gates - the vendored copy is the one that was synced
        entry: python3 scripts/_ha_standards/run.py verify
        language: system
        pass_filenames: false
        always_run: true

      - id: ha-quality-scale
        name: Quality scale - the code holds what quality_scale.yaml claims
        entry: python3 scripts/_ha_standards/run.py quality-scale
        language: system
        pass_filenames: false
        always_run: true

      - id: ha-types
        name: Types - mypy --strict against the targeted Home Assistant
        entry: python3 scripts/_ha_standards/run.py types
        language: system
        pass_filenames: false
        always_run: true

      - id: ha-tests
        name: Tests - against the targeted Home Assistant, in Docker
        entry: python3 scripts/_ha_standards/run.py tests -q
        language: system
        pass_filenames: false
        always_run: true

      - id: ha-coverage
        name: Coverage - the floors the claimed tier requires
        entry: python3 scripts/_ha_standards/run.py coverage
        language: system
        pass_filenames: false
        always_run: true

      - id: ha-commit-message
        name: Commit message - Conventional Commits, in English
        entry: python3 scripts/_ha_standards/run.py commit-message
        language: system
        stages: [commit-msg]
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.8
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-json
      - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-added-large-files
        args: [--maxkb=600]
      - id: check-merge-conflict
      - id: detect-private-key
